name: Multiplatform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew :shared:jvmTest --no-daemon
      - run: python3 -m unittest discover -s server/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test shared code on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - name: Generate native app project
        run: cd iosApp && xcodegen generate
      - name: Select simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          device = next(d for runtime, devices in data['devices'].items() if 'iOS' in runtime for d in devices if d['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('VGET_SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: Build and test iOS app without distribution signing
        run: >-
          xcodebuild -project iosApp/VGet.xcodeproj -scheme VGet
          -destination "platform=iOS Simulator,id=$VGET_SIMULATOR_ID"
          -derivedDataPath iosApp/build -resultBundlePath iosApp/TestResults.xcresult
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO test
      - name: Verify app launch and capture simulator screen
        run: |
          xcrun simctl bootstatus "$VGET_SIMULATOR_ID" -b
          xcrun simctl install "$VGET_SIMULATOR_ID" iosApp/build/Build/Products/Debug-iphonesimulator/VGet.app
          xcrun simctl launch --terminate-running-process "$VGET_SIMULATOR_ID" com.vget.app
          sleep 3
          xcrun simctl io "$VGET_SIMULATOR_ID" screenshot iosApp/VGet-simulator.png
      - name: Compile device framework
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --no-daemon
      - name: Upload simulator app and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v-get-ios-simulator
          path: |
            iosApp/build/Build/Products/Debug-iphonesimulator/VGet.app
            iosApp/TestResults.xcresult
            iosApp/VGet-simulator.png
            shared/build/reports/tests/
