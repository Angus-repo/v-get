name: Android build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        env:
          VGET_KEYSTORE_BASE64: ${{ secrets.VGET_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          value = os.environ.get('VGET_KEYSTORE_BASE64', '')
          if not value.strip():
              raise SystemExit('Missing VGET_KEYSTORE_BASE64 repository secret. Restore the retained V-Get 1.2.1 signing key; do not generate a new key. See docs/SIGNING.md.')
          os.umask(0o077)
          target = Path(os.environ['RUNNER_TEMP']) / 'v-get.keystore'
          target.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'VGET_KEYSTORE_FILE={target}\n')
          PY
      - name: Build APK with the retained signing key
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v-get-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f -- "$RUNNER_TEMP/v-get.keystore"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: app/build/reports/
