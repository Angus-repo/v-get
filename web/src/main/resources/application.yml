server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  tomcat:
    max-http-form-post-size: 8KB
spring:
  application:
    name: clippocket
  mvc:
    async:
      request-timeout: 120s
  servlet:
    multipart:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
clippocket:
  executable: ${YT_DLP_BIN:yt-dlp}
  work-dir: ${VIDEO_WORK_DIR:${java.io.tmpdir}/clippocket}
  inspect-timeout: 40s
  download-timeout: 5m
  metadata-ttl: 10m
  file-ttl: 30m
  max-file-bytes: 262144000
  max-working-bytes: 786432000
  max-duration-seconds: 1800
  max-jobs: 8
  max-jobs-per-session: 3
  max-metadata: 40
logging:
  level:
    root: INFO
    tw.angus.clippocket: INFO
