services:
  clippocket:
    build:
      context: .
      args:
        YT_DLP_VERSION: ${YT_DLP_VERSION:-2026.8.19}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1536m,mode=1777
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 192
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    restart: unless-stopped
